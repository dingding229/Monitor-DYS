<!doctype html>
<html lang="zh-CN" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <script>{let t;try{t=localStorage.getItem('dys:theme')}catch{}document.documentElement.dataset.theme=/^(?:emerald|ocean|indigo|amber|rose|slate)$/.test(t||'')?t:'emerald'}</script>
    <!-- Critical paint: keep in sync with --bg/--surface/--border in app.css. -->
    <style>html,body{background:#eaedf2;color:#0b1320;margin:0}.boot-header{height:50px;background:#fff;border-bottom:1px solid #d4dde8}</style>
    <link rel="preload" href="/api/nodes" as="fetch" crossorigin="anonymous" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Monitor</title>
  </head>
  <body>
    <div id="app"><div class="boot-header" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
